  <style>

*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.01em} button,input,select{font:inherit} button{color:inherit}

.nav-label{color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.12em;padding:13px 10px 7px}.nav{display:grid;gap:3px}.nav a{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:560}.nav a:hover{background:var(--surface-3);color:var(--text)}.nav a.active{background:var(--primary-soft);color:var(--primary)}.nav svg{width:17px;height:17px;flex:none}.sidebar-footer{margin-top:auto;padding:16px 8px 0;border-top:1px solid var(--border)}.scope{font-size:11px;color:var(--muted)}.scope strong{display:block;color:var(--text);font-size:12px;margin-bottom:4px}
.main{min-width:0}.topbar{height:72px;display:flex;align-items:center;gap:12px;padding:0 34px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);position:sticky;top:0;z-index:15}.crumb{font-size:12px;color:var(--muted);flex:1}.crumb b{color:var(--text);font-weight:650}.control{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 10px;color:var(--muted)}.icon-btn{border:1px solid var(--border);background:var(--surface);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer}.icon-btn:hover,.control:hover{border-color:color-mix(in srgb,var(--primary) 45%,var(--border));color:var(--text)}
.content{max-width:1540px;margin:0 auto;padding:32px 36px 58px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--faint);font-weight:700}.hero{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;margin-bottom:28px}.hero h1{font-size:31px;line-height:1.12;margin:5px 0 6px;letter-spacing:-.035em;font-weight:680}.hero p{margin:0;color:var(--muted);max-width:760px}.hero-actions{display:flex;gap:8px}.btn{border:1px solid var(--border);background:var(--surface-2);padding:9px 13px;border-radius:10px;cursor:pointer;font-weight:620}.btn:hover{border-color:var(--primary);color:var(--primary)}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}[data-theme="dark"] .btn.primary{color:#13201e}
.metric-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:22px 0 30px}.metric{padding:18px 20px 17px;border-right:1px solid var(--border)}.metric:first-child{padding-left:0}.metric:last-child{border:0}.metric .label{color:var(--muted);font-size:11px}.metric .value{font-size:25px;font-weight:680;letter-spacing:-.035em;margin-top:4px}.metric .delta{font-size:11px;margin-top:4px;color:var(--muted)}.delta.bad{color:var(--danger)}.delta.good{color:var(--success)}
.grid{display:grid;gap:18px}.grid.cols-2{grid-template-columns:minmax(0,1.45fr) minmax(300px,.75fr)}.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;box-shadow:0 1px 0 rgba(255,255,255,.02)}.panel.flat{box-shadow:none;background:transparent}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.panel h2{font-size:15px;margin:0;font-weight:680;letter-spacing:-.015em}.panel .sub{color:var(--muted);font-size:11px;margin-top:3px}.pill{font-size:10px;padding:4px 7px;border-radius:999px;background:var(--surface-3);color:var(--muted);white-space:nowrap}.pill.danger{background:var(--danger-soft);color:var(--danger)}.pill.warning{background:var(--warning-soft);color:var(--warning)}.pill.success{background:var(--success-soft);color:var(--success)}
.flow{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:0;padding:25px 10px 12px}.flow:before{content:"";position:absolute;left:7%;right:7%;top:43px;height:1px;background:var(--border)}.flow-stage{position:relative;text-align:center;cursor:pointer;z-index:1}.flow-node{width:36px;height:36px;margin:0 auto 11px;border-radius:50%;border:1px solid var(--border);background:var(--surface-2);display:grid;place-items:center;font-size:11px;font-weight:750}.flow-stage.alert .flow-node{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}.flow-stage.warn .flow-node{border-color:var(--warning);background:var(--warning-soft);color:var(--warning)}.flow-stage.ok .flow-node{border-color:var(--success);background:var(--success-soft);color:var(--success)}.flow-stage b{display:block;font-size:11px}.flow-stage span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.flow-stage .money{font-size:12px;color:var(--text);font-weight:680;margin-top:6px}
.attention{display:grid;gap:2px}.attn-item{display:grid;grid-template-columns:34px 1fr auto;gap:11px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--border);cursor:pointer}.attn-item:last-child{border-bottom:0}.attn-item:hover{background:var(--surface-3);margin:0 -8px;padding-left:12px;padding-right:12px;border-radius:8px}.rank{width:26px;height:26px;border-radius:7px;background:var(--surface-3);display:grid;place-items:center;color:var(--muted);font-size:11px}.attn-item strong{font-size:12px}.attn-item small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.impact{text-align:right;font-size:12px;font-weight:690}.impact small{font-weight:500}
.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:var(--faint);font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;padding:9px 8px;border-bottom:1px solid var(--border)}.table td{padding:11px 8px;border-bottom:1px solid var(--border);font-size:11px}.table tr:last-child td{border-bottom:0}.table tbody tr{cursor:pointer}.table tbody tr:hover{background:var(--surface-3)}.money{text-align:right;font-variant-numeric:tabular-nums}.status{display:inline-flex;align-items:center;gap:6px;font-size:10px}.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}.dot.red{background:var(--danger)}.dot.amber{background:var(--warning)}.dot.green{background:var(--success)}.dot.blue{background:var(--blue)}
.bars{display:grid;gap:13px}.bar-row{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center;font-size:11px}.bar{height:7px;background:var(--surface-3);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--primary);border-radius:inherit}.bar-row .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}

.timeline{display:grid;gap:0}.event{display:grid;grid-template-columns:58px 16px 1fr;gap:9px}.event-time{font-size:10px;color:var(--muted);padding-top:1px}.event-rail{position:relative}.event-rail:before{content:"";position:absolute;left:7px;top:7px;bottom:-14px;width:1px;background:var(--border)}.event:last-child .event-rail:before{display:none}.event-rail:after{content:"";position:absolute;left:4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--primary)}.event-body{padding-bottom:16px;font-size:11px}.event-body b{display:block}.event-body span{color:var(--muted)}
.kpi-big{font-size:36px;font-weight:690;letter-spacing:-.045em}.muted{color:var(--muted)}.danger-text{color:var(--danger)}.warning-text{color:var(--warning)}.success-text{color:var(--success)}
.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden}.detail-cell{background:var(--surface);padding:14px}.detail-cell small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em}.detail-cell b{display:block;font-size:13px;margin-top:5px}
.drawer-backdrop{position:fixed;inset:0;background:rgba(10,15,20,.24);z-index:50;opacity:0;pointer-events:none;transition:.2s}.drawer-backdrop.open{opacity:1;pointer-events:auto}.drawer{position:absolute;right:0;top:0;height:100%;width:min(520px,92vw);background:var(--surface);border-left:1px solid var(--border);padding:26px;transform:translateX(100%);transition:.24s ease;overflow:auto}.drawer-backdrop.open .drawer{transform:none}.drawer-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:24px}.drawer h2{margin:3px 0 0;font-size:22px}.drawer .close{border:1px solid var(--border);background:var(--surface-2);border-radius:9px;width:34px;height:34px;cursor:pointer}.drawer-section{padding:18px 0;border-top:1px solid var(--border)}.drawer-section h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 12px}
.presentation .sidebar{display:none}.presentation .shell{grid-template-columns:1fr}.presentation .topbar{padding-left:48px}.presentation .content{max-width:1700px;padding-left:48px;padding-right:48px}.present-hint{display:none}.presentation .present-hint{display:block;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:40;background:var(--text);color:var(--bg);padding:7px 12px;border-radius:999px;font-size:10px;opacity:.75}
@media(max-width:1100px){:root{--sidebar:210px}.grid.cols-2{grid-template-columns:1fr}.metric-strip{grid-template-columns:repeat(2,1fr)}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid var(--border)}.detail-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:780px){.shell{display:block}.sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;height:66px;border:0;border-top:1px solid var(--border);padding:7px 8px;background:var(--surface);z-index:40}.brand,.nav-label,.sidebar-footer{display:none}.nav{display:flex;overflow-x:auto;justify-content:space-between}.nav a{min-width:62px;padding:6px;display:grid;place-items:center;gap:1px;font-size:9px}.nav a svg{width:16px}.topbar{height:62px;padding:0 14px}.topbar .crumb,.topbar .present-btn{display:none}.control{max-width:120px}.content{padding:24px 16px 92px}.hero{display:block}.hero-actions{margin-top:16px}.hero h1{font-size:26px}.grid.cols-3{grid-template-columns:1fr}.metric-strip{grid-template-columns:1fr 1fr}.flow{overflow-x:auto;grid-template-columns:repeat(6,110px);padding-left:0;padding-right:0}.graph-canvas{height:460px}.bar-row{grid-template-columns:90px 1fr 58px}.detail-grid{grid-template-columns:1fr 1fr}.presentation .topbar,.presentation .content{padding-left:16px;padding-right:16px}}

<body>
  <div id="app"></div>
  <div id="drawer-root"></div>
  <script>
const routes = {
  overview: {label:'Operação Nacional', icon:'home'},
  graph: {label:'Capital Graph', icon:'graph'},
  land: {label:'Land Bank', icon:'land'},
  juridico: {label:'Jurídico', icon:'scale'},
  financeiro: {label:'Financeiro', icon:'wallet'},
  comercial: {label:'Comercial', icon:'trend'},
  marketing: {label:'Marketing', icon:'megaphone'},
  smart: {label:'Smart Cities', icon:'city'},
  attention: {label:'Minha Atenção', icon:'alert'},
  asset: {label:'Detalhe do Ativo', icon:'land', nav:false}
};
const roleConfig = {
  diretoria:{label:'Diretoria / Controladoria', scope:'Operação nacional · todos os estados', routes:Object.keys(routes)},
  juridico:{label:'Jurídico', scope:'Processos, contratos, prazos e obrigações', routes:['overview','graph','juridico','attention']},
  financeiro:{label:'Financeiro', scope:'Pagar, receber, cobrança, caixa e orçamento', routes:['overview','graph','financeiro','attention']},
  comercial:{label:'Comercial', scope:'Pipeline, propostas, vendas e conversão', routes:['overview','graph','comercial','attention']},
  marketing:{label:'Marketing', scope:'Campanhas, atribuição e receita', routes:['overview','graph','marketing','attention']},
  desenvolvimento:{label:'Desenvolvimento / Land Bank', scope:'Ativos, due diligence, gates e VGV', routes:['overview','graph','land','asset','smart','attention']}
};
function storageGet(k,fallback){try{return localStorage.getItem(k)||fallback}catch(e){return fallback}}
function storageSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const state = {role:storageGet('role','diretoria'),theme:storageGet('theme','light'),presentation:false,route:'overview'};
const icons = {
  home:'<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',
  graph:'<circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="m7 7 4 9m6-9-4 9M7 6h10"/>',
  land:'<path d="M3 18 8 6l5 12 4-8 4 8z"/><path d="M3 21h18"/>',
  scale:'<path d="M12 3v18M5 6h14M7 6l-4 8h8L7 6Zm10 0-4 8h8l-4-8ZM8 21h8"/>',
  wallet:'<path d="M3 6h16a2 2 0 0 1 2 2v10H5a2 2 0 0 1-2-2V6Zm0 0 13-3v3"/><path d="M16 11h5v4h-5a2 2 0 1 1 0-4Z"/>',
  trend:'<path d="m3 17 6-6 4 4 8-9"/><path d="M15 6h6v6"/>',
  megaphone:'<path d="M4 13V8l13-4v13L4 13Zm0 0 2 7h4l-1.5-6"/><path d="M19 8c2 1 2 4 0 5"/>',
  city:'<path d="M3 21V9h6v12m2 0V3h7v18m-13-8h2m-2 4h2m8-10h1m-1 4h1m-1 4h1m4 6V12h3v9"/>',
  alert:'<path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 9v5m0 3h.01"/>'
};
function svg(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${icons[name]}</svg>`}
function fmtRoute(r){return routes[r]?.label||r}
function nav(){
  const allowed=roleConfig[state.role].routes;
  return `<div class="nav">${allowed.filter(r=>routes[r]?.nav!==false).map(r=>`<a href="#/${r}" data-route="${r}" class="${state.route===r?'active':''}">${svg(routes[r].icon)}<span>${routes[r].label}</span></a>`).join('')}</div>`;
}
function shell(content){
  return `<div class="shell"><aside class="sidebar"><div class="brand"><div class="mark">C</div><div><b>CAPITAL</b><small>capital intelligence</small></div></div><div class="nav-label">Navegação</div>${nav()}<div class="sidebar-footer"><div class="scope"><strong>${roleConfig[state.role].label}</strong>${roleConfig[state.role].scope}</div></div></aside><main class="main"><header class="topbar"><div class="crumb">CAPITAL / <b>${fmtRoute(state.route)}</b></div><select id="role" class="control" aria-label="Persona">${Object.entries(roleConfig).map(([k,v])=>`<option value="${k}" ${state.role===k?'selected':''}>${v.label}</option>`).join('')}</select><button class="icon-btn" id="theme" title="Alternar tema">${state.theme==='light'?'◐':'◑'}</button><button class="btn present-btn" id="present">Apresentar</button></header><div class="content">${content}</div></main></div><div class="present-hint">← → navegam · Esc sai da apresentação</div>`;
}
function metricStrip(items){return `<div class="metric-strip">${items.map(x=>`<div class="metric"><div class="label">${x.label}</div><div class="value">${x.value}</div><div class="delta ${x.tone||''}">${x.delta||'&nbsp;'}</div></div>`).join('')}</div>`}
function hero(kicker,title,desc,actions=''){return `<section class="hero"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${actions?`<div class="hero-actions">${actions}</div>`:''}</section>`}
function panel(title,sub,body,extra=''){return `<section class="panel"><div class="panel-head"><div><h2>${title}</h2>${sub?`<div class="sub">${sub}</div>`:''}</div>${extra}</div>${body}</section>`}
function attention(items){return `<div class="attention">${items.map((x,i)=>`<div class="attn-item" data-drawer="${x.drawer||'generic'}"><div class="rank">${i+1}</div><div><strong>${x.title}</strong><small>${x.sub}</small></div><div class="impact ${x.tone||''}">${x.impact}<small>${x.unit||''}</small></div></div>`).join('')}</div>`}
function flow(){return `<div class="flow">
  <div class="flow-stage warn" data-drawer="land"><div class="flow-node">01</div><b>Land Bank</b><span>2 gates críticos</span><div class="money">R$ 142M</div></div>
  <div class="flow-stage warn" data-drawer="dev"><div class="flow-node">02</div><b>Desenvolvimento</b><span>3 bloqueios</span><div class="money">R$ 38M</div></div>
  <div class="flow-stage ok" data-drawer="marketing"><div class="flow-node">03</div><b>Marketing</b><span>ROAS 8,9x</span><div class="money">R$ 8,4M</div></div>
  <div class="flow-stage ok" data-drawer="sales"><div class="flow-node">04</div><b>Comercial</b><span>72% conversão</span><div class="money">R$ 18,2M</div></div>
  <div class="flow-stage alert" data-drawer="legal"><div class="flow-node">05</div><b>Jurídico</b><span>7,4M expostos</span><div class="money">R$ 7,4M</div></div>
  <div class="flow-stage warn" data-drawer="finance"><div class="flow-node">06</div><b>Financeiro</b><span>61 vencidos</span><div class="money">R$ 4,1M</div></div>
</div>`}
function overview(){return shell(
 hero('Operação nacional','Dinheiro na mesa, sem ruído.','O CAPITAL destaca onde valor, VGV ou caixa dependem de uma ação — e permite navegar até a causa, o responsável e o próximo gate.',`<button class="btn" data-go="graph">Explorar grafo</button><button class="btn primary" data-go="attention">Ver prioridades</button>`)+
 metricStrip([{label:'VGV monitorado',value:'R$ 2,8 bi',delta:'+6,2% vs. plano',tone:'good'},{label:'Capital / VGV sob atenção',value:'R$ 286 mi',delta:'9 eventos relevantes',tone:'bad'},{label:'Receita prevista · 30 dias',value:'R$ 48,6 mi',delta:'86% de confiança'},{label:'Money Velocity',value:'31 dias',delta:'-4 dias no trimestre',tone:'good'}])+
 `<div class="grid cols-2">${panel('Fluxo do capital','Do ativo ao caixa. Cores aparecem somente onde há exceção.',flow(),'<span class="pill">tempo real</span>')}${panel('Maior impacto agora','Ordenado por valor × urgência × dependência.',attention([
  {title:'Licenciamento · GO-018',sub:'Gate G04 parado há 41 dias',impact:'R$ 142M',unit:' VGV',tone:'danger-text',drawer:'land'},
  {title:'Auditoria contratual · CT-3421',sub:'2 cláusulas críticas antes da assinatura',impact:'R$ 3,8M',unit:' exp.',drawer:'legal'},
  {title:'Recebíveis vencidos · Aurora Park',sub:'61 títulos · concentração em 11 clientes',impact:'R$ 1,2M',unit:' caixa',drawer:'finance'},
  {title:'Campanha Jardins',sub:'Conversão caiu 18% nas últimas 72h',impact:'R$ 890k',unit:' pipeline',drawer:'marketing'}
]))}</div>`+

function renderRoute(){
  const path=(location.hash.replace('#/','')||'overview').split('/')[0];
  state.route=routes[path]?path:'overview';
  if(!roleConfig[state.role].routes.includes(state.route)) state.route='overview';
  const fn={overview,graph:graphPage,land:landPage,asset:assetPage,juridico:legalPage,financeiro:financePage,comercial:salesPage,marketing:marketingPage,smart:smartPage,attention:attentionPage}[state.route]||overview;
  document.documentElement.dataset.theme=state.theme;
  document.body.classList.toggle('presentation',state.presentation);
  document.getElementById('app').innerHTML=fn();
  bind();
}
function bind(){
  document.getElementById('role')?.addEventListener('change',e=>{state.role=e.target.value;storageSet('role',state.role);if(!roleConfig[state.role].routes.includes(state.route))location.hash='#/overview';renderRoute()});
  document.getElementById('theme')?.addEventListener('click',()=>{state.theme=state.theme==='light'?'dark':'light';storageSet('theme',state.theme);renderRoute()});
  document.getElementById('present')?.addEventListener('click',()=>{state.presentation=!state.presentation;renderRoute()});
  document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>location.hash='#/'+el.dataset.go));
  document.querySelectorAll('[data-drawer]').forEach(el=>el.addEventListener('click',()=>openDrawer(el.dataset.drawer)));
}
